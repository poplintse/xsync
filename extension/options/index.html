<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xsync lite</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <h1>xsync lite</h1>
        <p id="statusText">未连接</p>
      </div>
    </header>

    <section class="panel">
      <label>
        服务器地址
        <input id="serverUrlInput" type="url" autocomplete="off">
      </label>

      <fieldset class="token-mode">
        <legend>Token</legend>
        <label class="radio-option">
          <input type="radio" name="tokenMode" value="existing">
          使用已有 Token
        </label>
        <label class="radio-option">
          <input type="radio" name="tokenMode" value="new">
          生成新 Token
        </label>
      </fieldset>

      <div id="existingTokenPanel" class="token-editor">
        <label>
          已保存的 Token 名称
          <select id="existingTokenNameSelect"></select>
        </label>
        <label>
          Token
          <input id="existingTokenValueInput" type="password" autocomplete="off" placeholder="输入该名称对应的 Token">
        </label>
        <div class="inline-actions">
          <button id="refreshTokenNamesButton" type="button">刷新名称列表</button>
          <button id="useExistingTokenButton" type="button">使用此 Token</button>
        </div>
      </div>

      <div id="newTokenPanel" class="token-editor" hidden>
        <label>
          Token 名称
          <input id="newTokenNameInput" type="text" maxlength="80" autocomplete="off" placeholder="例如：个人书签">
        </label>
        <button id="generateTokenButton" type="button">生成新 Token 并保存</button>
        <label id="generatedTokenField" class="generated-token-field" hidden>
          新 Token，请妥善保存
          <input id="generatedTokenOutput" type="text" readonly>
        </label>
      </div>

      <fieldset>
        <legend>同步方式</legend>
        <label class="radio-option">
          <input type="radio" name="mode" value="merge">
          合并
        </label>
        <label class="radio-option">
          <input type="radio" name="mode" value="local_over_server">
          本地覆盖服务器
        </label>
        <label class="radio-option">
          <input type="radio" name="mode" value="server_over_local">
          服务器覆盖本地
        </label>
      </fieldset>
    </section>

    <section class="panel bookmark-panel">
      <div class="panel-title">
        <div>
          <h2>本地书签目录</h2>
          <p class="hint">只能选择一个目录或具体书签；选择目录会包含其全部子目录。</p>
        </div>
        <button id="reloadBookmarksButton" type="button">刷新</button>
      </div>
      <div id="bookmarkTree" class="tree"></div>
    </section>

    <section class="panel">
      <div class="actions">
        <button id="syncButton" type="button" class="primary">立即同步</button>
      </div>
      <div id="resultBox" class="result-box">尚未同步。</div>
    </section>
  </main>

  <script src="options.js"></script>
</body>
</html>
