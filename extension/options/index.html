<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xsync lite</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <h1>xsync lite</h1>
        <p id="statusText">未连接</p>
      </div>
    </header>

    <section class="panel">
      <label>
        服务器地址
        <input id="serverUrlInput" type="url" autocomplete="off">
      </label>

      <fieldset class="token-mode">
        <legend>账户</legend>
        <label class="radio-option">
          <input type="radio" name="accountMode" value="local">
          使用本机账户
        </label>
        <label class="radio-option">
          <input type="radio" name="accountMode" value="new">
          新建账户
        </label>
        <label class="radio-option">
          <input type="radio" name="accountMode" value="pair">
          配对已有账户
        </label>
      </fieldset>

      <div id="localAccountPanel" class="token-editor">
        <label>
          本机已授权账户
          <select id="localAccountSelect"></select>
        </label>
        <div class="inline-actions">
          <button id="useLocalAccountButton" type="button">使用此账户</button>
          <button id="startPairingButton" type="button">添加新设备</button>
        </div>
        <p id="pairingCodeBox" class="pairing-code" hidden></p>
      </div>

      <div id="newAccountPanel" class="token-editor" hidden>
        <label>
          账户名称
          <input id="newAccountNameInput" type="text" maxlength="80" autocomplete="off" placeholder="例如：个人书签">
        </label>
        <label>
          当前设备名称
          <input id="newDeviceNameInput" type="text" maxlength="80" autocomplete="off" placeholder="例如：Home Chrome">
        </label>
        <button id="createAccountButton" type="button">新建账户</button>
      </div>

      <div id="pairAccountPanel" class="token-editor" hidden>
        <label>
          配对码
          <input id="pairingCodeInput" type="text" inputmode="numeric" maxlength="7" autocomplete="off" placeholder="由已授权设备生成">
        </label>
        <label>
          当前设备名称
          <input id="pairDeviceNameInput" type="text" maxlength="80" autocomplete="off" placeholder="例如：Office Chrome">
        </label>
        <button id="finishPairingButton" type="button">完成配对</button>
      </div>

      <fieldset>
        <legend>操作</legend>
        <label class="radio-option">
          <input type="radio" name="operation" value="backup">
          备份
        </label>
        <label class="radio-option">
          <input type="radio" name="operation" value="restore">
          恢复
        </label>
      </fieldset>

      <div id="restorePanel" class="token-editor restore-panel" hidden>
        <label>
          服务器备份
          <select id="backupSelect"></select>
        </label>
        <button id="refreshBackupsButton" type="button">刷新备份列表</button>
      </div>
    </section>

    <section id="bookmarkPanel" class="panel bookmark-panel">
      <div class="panel-title">
        <div>
          <h2>本地书签目录</h2>
          <p class="hint">备份时只能选择收藏夹目录；单个书签可浏览但不可选择。</p>
        </div>
        <button id="reloadBookmarksButton" type="button">刷新</button>
      </div>
      <div id="bookmarkTree" class="tree"></div>
    </section>

    <section class="panel">
      <div class="actions">
        <button id="actionButton" type="button" class="primary">立即备份</button>
      </div>
      <div id="resultBox" class="result-box">尚未执行操作。</div>
    </section>
  </main>

  <script src="options.js"></script>
</body>
</html>
