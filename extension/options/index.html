<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xsync</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <h1>xsync lite</h1>
        <p id="statusText">未连接</p>
      </div>
    </header>

    <section class="panel">
      <label>
        服务器地址
        <input id="serverUrlInput" type="url" autocomplete="off">
      </label>

      <label>
        当前 Token
        <select id="tokenSelect"></select>
      </label>

      <div class="token-editor">
        <label>
          Token 名称
          <input id="tokenNameInput" type="text" maxlength="80" autocomplete="off" placeholder="例如：个人书签">
        </label>

        <label>
          Token
          <input id="tokenValueInput" type="password" autocomplete="off" placeholder="生成新的或填写已有 Token">
        </label>

        <div class="inline-actions">
          <button id="generateTokenButton" type="button">生成新 Token</button>
          <button id="saveTokenButton" type="button">保存 Token</button>
        </div>
      </div>

      <label>
        远端集合 ID
        <input id="collectionIdInput" type="number" min="1" placeholder="留空则创建新集合">
      </label>

      <label>
        远端集合名称
        <input id="collectionNameInput" type="text" placeholder="例如：Bookmarks Bar">
      </label>

      <fieldset>
        <legend>同步方式</legend>
        <label class="radio-option">
          <input type="radio" name="mode" value="merge">
          合并
        </label>
        <label class="radio-option">
          <input type="radio" name="mode" value="local_over_server">
          本地覆盖服务器
        </label>
        <label class="radio-option">
          <input type="radio" name="mode" value="server_over_local">
          服务器覆盖本地
        </label>
      </fieldset>
    </section>

    <section class="panel bookmark-panel">
      <div class="panel-title">
        <h2>本地书签目录</h2>
        <button id="reloadBookmarksButton" type="button">刷新</button>
      </div>
      <div id="bookmarkTree" class="tree"></div>
    </section>

    <section class="panel">
      <div class="actions">
        <button id="previewButton" type="button">预览变更</button>
        <button id="syncButton" type="button" class="primary">立即同步</button>
      </div>
      <pre id="resultBox"></pre>
    </section>
  </main>

  <script src="options.js"></script>
</body>
</html>
